name: Crawler · weekly full sync

# 매주 일요일 KST 04:00 (UTC 토 19:00) 2021년부터 전체 훑음. ~30분.
# 종영작의 TMDB 메타(포스터/시놉시스 편집 등) 최신화 목적.
on:
  schedule:
    - cron: '0 19 * * 6'
  workflow_dispatch:

concurrency:
  group: crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crawler
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crawler/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run crawler (full sync since 2021)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          CRAWL_START_DATE: '2021-01-01'
          CRAWL_MAX_PAGES: '100'
        run: npm start
